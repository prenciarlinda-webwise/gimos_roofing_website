# Nginx configuration for gimosroofing.com
# Copy the relevant sections to your Nginx server block configuration
# Typically located at: /etc/nginx/sites-available/gimosroofing.com

server {
    listen 80;
    server_name www.gimosroofing.com gimosroofing.com;
    return 301 https://www.gimosroofing.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gimosroofing.com;

    # SSL configuration (adjust paths to your certificate files)
    ssl_certificate /etc/letsencrypt/live/gimosroofing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gimosroofing.com/privkey.pem;

    return 301 https://www.gimosroofing.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.gimosroofing.com;

    # SSL configuration (adjust paths to your certificate files)
    ssl_certificate /etc/letsencrypt/live/gimosroofing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gimosroofing.com/privkey.pem;

    # Root directory - adjust to your static export location
    root /var/www/gimosroofing.com/out;
    index index.html;

    # ============================================
    # SECURITY HEADERS
    # ============================================
    add_header X-DNS-Prefetch-Control "on" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ============================================
    # TRAILING SLASH REDIRECTS (301)
    # Remove trailing slashes from URLs
    # ============================================
    rewrite ^/(.*)/$ /$1 permanent;

    # ============================================
    # URL TYPO & OLD URL REDIRECTS (301)
    # ============================================

    # St. Augustine typo fix (period in URL)
    location = /roofing-st.-augustine-fl {
        return 301 https://www.gimosroofing.com/roofing-st-augustine-fl;
    }

    # Old URL redirects
    location = /about-us {
        return 301 https://www.gimosroofing.com/about;
    }
    location = /contact-us {
        return 301 https://www.gimosroofing.com/contact;
    }
    location = /roofing-services {
        return 301 https://www.gimosroofing.com/services;
    }
    location = /siding-services {
        return 301 https://www.gimosroofing.com/services;
    }
    location = /roofing-and-siding-services-in-jacksonville-beach {
        return 301 https://www.gimosroofing.com/roofing-jacksonville-beach-fl;
    }

    # Old blog post redirects
    location = /why-quality-roofing-matters-in-jacksonville-fl-trust-gimos-roofing-for-your-home {
        return 301 https://www.gimosroofing.com/blog;
    }
    location = /protect-your-home-why-choosing-professional-roofing-services-matters {
        return 301 https://www.gimosroofing.com/blog;
    }
    location = /signs-you-need-roof-repair-jacksonville {
        return 301 https://www.gimosroofing.com/blog;
    }
    location = /blog/when-roof-needs-replacement {
        return 301 https://www.gimosroofing.com/blog/roof-repair-vs-replacement-jacksonville;
    }
    location = /blog/flat-roof-repair-jacksonville {
        return 301 https://www.gimosroofing.com/blog;
    }

    # Sitemap redirect
    location = /sitemap_index.xml {
        return 301 https://www.gimosroofing.com/sitemap.xml;
    }

    # ============================================
    # STATIC FILE HANDLING
    # ============================================

    # Try files, then directories, then fall back to index.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Cache static assets (1 year)
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images (1 month)
    location /images/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Cache fonts (1 year)
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /500.html;
}
